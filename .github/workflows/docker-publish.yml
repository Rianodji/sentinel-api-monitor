name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run test # Lance les tests unitaires de NestJS

  build-and-push:
    needs: test # <--- TRÈS IMPORTANT : Attend que les tests passent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-backend:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Nécessaire pour accéder au fichier yaml du repo

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "docker-compose.prod.yaml,infrastructure/"
          target: "~/sentinel/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/sentinel
            # Création du réseau externe s'il n'existe pas
            docker network inspect sentinel_network >/dev/null 2>&1 || \
            docker network create sentinel_network

            # On écrit les secrets dans un fichier .env pour Docker Compose
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env.docker
            echo "GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}" >> .env.docker
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env.docker
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.docker
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.docker
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env.docker
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.docker
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env.docker
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env.docker
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.docker
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.docker
            echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> .env.docker

            # Connexion au Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Déploiement de l'application principale uniquement
            docker compose --env-file .env.docker -f docker-compose.prod.yaml pull
            docker compose --env-file .env.docker -f docker-compose.prod.yaml up -d
            docker image prune -f